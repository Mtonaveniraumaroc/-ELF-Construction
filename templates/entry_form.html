{% extends 'base.html' %}{% block content %}<div class="heading"><h1>{{'Modifier l’opération #'+entry.id|string if entry else 'Nouvelle opération'}}</h1><a href="{{url_for('entries')}}">← Retour</a></div><div class="card"><form method="post" class="formgrid"><input type="hidden" name="csrf" value="{{session.csrf}}"><label>Type d’opération<select name="kind" required>{% for k,v in kinds.items() %}<option value="{{k}}" {% if entry and entry.kind==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>Date (AAAA-MM-JJ)<input type="date" name="date" value="{{entry.date if entry else ''}}" required></label><label>Description<input name="label" value="{{entry.label if entry else ''}}" required maxlength="250"></label><label>Montant en DH<input type="number" name="amount" step="0.01" min="0.01" value="{{entry.amount if entry else ''}}" required></label><label>Chantier<select name="site_id"><option value="">— Sans chantier —</option>{% for s in sites %}<option value="{{s.id}}" {% if entry and entry.site_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label><label>Client / fournisseur<select name="party_id"><option value="">— Aucun —</option>{% for p in parties %}<option value="{{p.id}}" {% if entry and entry.party_id==p.id %}selected{% endif %}>{{p.kind}} · {{p.name}}</option>{% endfor %}</select></label><label>Référence liée (pour paiements)<select name="parent_id"><option value="">— Non liée —</option>{% for p in parents %}<option value="{{p.id}}" {% if entry and entry.parent_id==p.id %}selected{% endif %}>#{{p.id}} · {{kinds[p.kind]}} · {{p.label[:45]}}</option>{% endfor %}</select></label><label>Contrôle<select name="status">{% for k,v in statuses.items() %}<option value="{{k}}" {% if entry and entry.status==k %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label class="full">Notes<textarea name="notes" rows="3">{{entry.notes if entry else ''}}</textarea></label><div class="full"><button>Enregistrer</button></div></form></div>
{% if entry %}<div class="card"><h2>Justificatifs</h2>{% for a in attachments %}<p><a href="{{url_for('attachment',ident=a.id)}}">📎 {{a.filename}}</a></p>{% else %}<p>Aucun justificatif.</p>{% endfor %}<form method="post" action="{{url_for('add_attachment',ident=entry.id)}}" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{session.csrf}}"><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.webp" required><button>Ajouter une pièce</button></form></div><form method="post" action="{{url_for('cancel_entry',ident=entry.id)}}"><input type="hidden" name="csrf" value="{{session.csrf}}"><button class="secondary">{{'Réactiver' if entry.cancelled else 'Annuler'}} cette opération (historique conservé)</button></form>{% endif %}{% endblock %}
