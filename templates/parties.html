{% extends 'base.html' %}{% block content %}<h1>Clients et fournisseurs</h1>{% if me.role!='direction' %}<div class="card"><h2>Ajouter un tiers</h2><form method="post" class="formgrid"><input type="hidden" name="csrf" value="{{session.csrf}}"><label>Catégorie<select name="kind"><option value="fournisseur">Fournisseur</option><option value="client">Client</option></select></label><label>Nom<input name="name" required></label><label class="full">Notes<input name="notes"></label><div><button>+ Ajouter</button></div></form></div>{% endif %}<div class="tablewrap"><table><tr><th>Catégorie</th><th>Nom</th><th>Notes</th></tr>{% for p in parties %}<tr><td>{{p.kind}}</td><td>{{p.name}}</td><td>{{p.notes}}</td></tr>{% endfor %}</table></div>{% endblock %}
