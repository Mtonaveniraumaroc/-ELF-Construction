{% extends 'base.html' %}{% block content %}<h1>Historique des imports</h1><div class="tablewrap"><table><tr><th>Fichier</th><th>Feuille</th><th>Type</th><th>Lignes</th><th>Date</th><th></th></tr>{% for b in batches %}<tr><td>{{b.filename}}</td><td>{{b.sheet}}</td><td>{{kinds[b.kind]}}</td><td>{{b.count}}</td><td>{{b.at}}</td><td>{% if me.role=='admin' %}<form method="post" action="{{url_for('undo_import',ident=b.id)}}"><input type="hidden" name="csrf" value="{{session.csrf}}"><button class="secondary">Annuler ce lot</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
